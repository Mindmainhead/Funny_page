<!DOCTYPE html>
<html>
<head>
    <title>My Media Website</title>
</head>
<style>
.pic{
    margin-top: 20px;
    border: 6px solid red;
    border-radius: 80px;
}
h2{
    font-weight: bold;
    text-decoration: underline;
    color: rgb(255, 0, 115);
}
h1{
    border: 3px;
    background-color: blueviolet;
    padding: 15px;
    display: inline-block;

}
p{
    color: brown;
    font-weight: bold;
}
@media screen {
    h1{
        margin: auto;
        border-radius: 20px;
    }
    
}
</style>
<body style="background-color: lightblue; text-align: center;">

    <h1>HERE THE FUNNY AUDIO AND VIDEO ENJOY!!</h1>

    </audio>
    <div>
        <img src="image1.jpeg"class = "pic">
    </div>

<div>

        <source src="video.mp4" type="video/mp4">

    </video>

</div>

    <img src="" width="300">

</html>
